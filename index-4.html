.logo{width:104px;height:104px;border-radius:50%;display:block;margin:-52px auto 0;position:relative;border:3px solid var(--blue);box-shadow:0 0 24px #1e90ffaa;background:#000}
h1{font-size:26px;text-align:center;margin:14px 0 4px;letter-spacing:.3px}
.sub{text-align:center;color:var(--mute);margin:0 0 20px;font-size:15px}
.file{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.file .ic{font-size:26px}
.file b{display:block;font-size:16px}
.file span{color:var(--mute);font-size:13px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:15px 14px;margin-bottom:10px;font:inherit;font-size:16px;cursor:pointer;transition:border-color .2s,background .2s}
.step .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:#0d2150;flex:none}
.step .t{flex:1}
.step .t small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.step .st{font-size:13px;color:var(--mute);min-width:56px;text-align:right}
.step:focus-visible,.pw input:focus-visible,.go:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.step.locked{opacity:.45;cursor:not-allowed}
.step.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 18px #1e90ff55}
.step.wait .st{color:var(--cyan)}
.step.done{border-color:var(--ok);background:#06231a;cursor:default}
.step.done .ic{background:var(--ok);color:#012}
.step.done .st{color:var(--ok);font-weight:700}
.prog{margin:20px 0 6px;display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.bar{height:10px;border-radius:99px;background:#0b1a3d;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .5s}
.pwbox{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.pwbox h2{margin:0 0 4px;font-size:18px}
.pwbox p{margin:0 0 12px;color:var(--mute);font-size:14px}
.pw{display:flex;gap:8px}
.pw input{flex:1;min-width:0;background:#030a1c;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;font:inherit;font-size:17px;text-align:center;letter-spacing:2px}
.go{background:linear-gradient(180deg,var(--blue),#0b5bd6);border:0;color:#fff;font:inherit;font-weight:700;border-radius:12px;padding:0 20px;cursor:pointer}
.pwbox.off{opacity:.45;pointer-events:none}
.msg{min-height:20px;margin-top:10px;font-size:14px}
.msg.err{color:#ff7b86}
.dl{display:none;margin-top:18px;text-align:center}
.dl a{display:block;background:linear-gradient(180deg,#2bf09a,#12b86a);color:#01140c;font-weight:800;font-size:18px;text-decoration:none;border-radius:14px;padding:16px;box-shadow:0 0 24px #22e58a66}
.dl.show{display:block}
.foot{margin-top:26px;text-align:center;color:var(--mute);font-size:12.5px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="file"><div class="ic">📦</div><div><b id="fileName">Your file</b><span>Locked until all steps are done</span></div></div>

  <div id="steps"></div>

  <div class="prog"><span>Unlock progress</span><span id="pt">0/3</span></div>
  <div class="bar"><i id="pb"></i></div>

  <div class="pwbox off" id="pwbox">
    <h2>Enter password</h2>
    <p id="hint">Watch the video — the password appears in it.</p>
    <div class="pw">
      <input id="pw" type="text" inputmode="text" autocomplete="off" autocapitalize="off" placeholder="Password" aria-label="Password">
      <button class="go" id="go">Unlock</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="dl" id="dl"><a id="dla" href="#" target="_blank" rel="noopener">⬇ Download now</a></div>

  <div style="text-align:center;margin-top:22px"><button id="reset" type="button" style="background:none;border:1px solid var(--line);color:var(--mute);font:inherit;font-size:14px;border-radius:10px;padding:9px 16px;cursor:pointer">↺ Reset</button></div>

  <div class="foot">© 2026 Shadow Modes Games<br>Not affiliated with any game publisher.</div>
</div>

<script src="config.js"></script>
<script>
var S=[
 {k:"sub",ic:"▶",t:"Subscribe on YouTube",d:"Opens the channel",u:CONFIG.channelUrl},
 {k:"like",ic:"👍",t:"Like the video",d:"Opens the video",u:CONFIG.videoUrl},
 {k:"com",ic:"💬",t:"Comment on the video",d:"Leave a comment on the video",u:CONFIG.videoUrl}
];
var done=0,busy=false,saved={};
try{saved=JSON.parse(localStorage.getItem("sm_steps")||"{}")}catch(e){}
var box=document.getElementById("steps");
document.getElementById("fileName").textContent=CONFIG.fileName;
document.getElementById("hint").textContent=CONFIG.hint;
S.forEach(function(s,i){
  var b=document.createElement("button");b.className="step";b.type="button";
  b.innerHTML='<span class="ic">'+s.ic+'</span><span class="t">'+s.t+'<small>'+s.d+'</small></span><span class="st">Start</span>';
  b.onclick=function(){go(i)};s.el=b;box.appendChild(b);
});
function paint(){
  S.forEach(function(s,i){
    var el=s.el,st=el.querySelector(".st");
    el.classList.remove("locked","active","done","wait");
    if(s.ok){el.classList.add("done");st.textContent="Done ✓";el.querySelector(".ic").textContent="✓"}
    else if(i===done&&!busy){el.classList.add("active");st.textContent="Start"}
    else if(i===done&&busy){el.classList.add("wait")}
    else{el.classList.add("locked");st.textContent="🔒"}
  });
  document.getElementById("pt").textContent=done+"/3";
  document.getElementById("pb").style.width=(done/3*100)+"%";
  document.getElementById("pwbox").classList.toggle("off",done<3);
}
function go(i){
  if(i!==done||busy)return;
  var s=S[i];
  s.ok=true;done++;paint();
  try{localStorage.setItem("sm_steps",JSON.stringify({n:done}))}catch(e){}
  var w=null;
  try{w=window.open(s.u,"_blank")}catch(e){}
  if(!w){try{window.top.location.href=s.u}catch(e){window.location.href=s.u}}
}
if(saved.n){for(var j=0;j<saved.n&&j<3;j++)S[j].ok=true;done=Math.min(saved.n,3)}
paint();
function unlock(){
  var m=document.getElementById("msg"),v=document.getElementById("pw").value.trim();
  if(done<3)return;
  if(v===CONFIG.password){
    m.className="msg";m.textContent="Unlocked.";
    document.getElementById("dla").href=CONFIG.downloadUrl;
    document.getElementById("dl").classList.add("show");
  }else{m.className="msg err";m.textContent="Wrong password. Check the video and try again."}
}
document.getElementById("go").onclick=unlock;
document.getElementById("reset").onclick=function(){
  S.forEach(function(s){s.ok=false;s.el.querySelector(".ic").textContent=s.ic});
  done=0;busy=false;
  try{localStorage.removeItem("sm_steps")}catch(e){}
  document.getElementById("pw").value="";
  document.getElementById("msg").textContent="";
  document.getElementById("dl").classList.remove("show");
  paint();
};
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
</script>
</body>
</html>
